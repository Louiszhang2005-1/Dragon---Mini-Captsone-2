; Keep build output outside OneDrive (sync locks break builds).
[platformio]
build_dir = ${sysenv.USERPROFILE}/.pio-build/RP2_Dragon_Remote

; PlatformIO project — Dragon Robot (MEC2105)
; Open this folder in VS Code with the PlatformIO extension installed.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor: same speed as Serial.begin(115200) in the code.
monitor_speed = 115200
monitor_echo = yes          ; show the letters you type
monitor_filters = esp32_exception_decoder
